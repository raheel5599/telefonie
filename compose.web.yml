services:
  telefonie-web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:ro
      - telefonie_data:/data
      - ./private/manager.conf:/run/secrets/ami.conf:ro
    command: ["node","server.mjs"]
    environment:
      DATA_DIR: /data
      AMI_CONFIG: /run/secrets/ami.conf
      AMI_HOST: tariq-telefonie-asterisk
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 80
    ports:
      - "127.0.0.1:3095:3095"
    security_opt:
      - no-new-privileges:true
    networks:
      - telefonie_web
      - caddy_shared
      - pbx_shared
volumes:
  telefonie_data:

networks:
  telefonie_web:
    driver: bridge
  caddy_shared:
    external: true
    name: fahrschulpilot_web
  pbx_shared:
    external: true
    name: tariq-telefonie-pbx_pbx_private
