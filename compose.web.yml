name: tariq-backend
services:
  telefonie-web:
    container_name: tariq-telefonie-telefonie-web-1
    image: tariq-telefonie-web:local
    build:
      context: .
      dockerfile: deployment/Dockerfile.web
    working_dir: /app
    volumes:
      - ./:/app:ro
      - telefonie_data:/data
      - ./private/manager.conf:/run/secrets/ami.conf:ro
    command: ["node","server.mjs"]
    environment:
      DATA_DIR: /data
      AMI_CONFIG: /run/secrets/ami.conf
      AMI_HOST: tariq-telefonie-asterisk
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 128
    ports:
      - "127.0.0.1:3095:3095"
    security_opt:
      - no-new-privileges:true
    networks:
      - telefonie_web
      - caddy_shared
      - pbx_shared
volumes:
  telefonie_data:
    external: true
    name: tariq-telefonie_telefonie_data

networks:
  telefonie_web:
    external: true
    name: tariq-telefonie_telefonie_web
  caddy_shared:
    external: true
    name: fahrschulpilot_web
  pbx_shared:
    external: true
    name: tariq-telefonie-pbx_pbx_private
