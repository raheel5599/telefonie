services:
  telefonie-web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:ro
      - telefonie_data:/data
    command: ["node","server.mjs"]
    environment:
      DATA_DIR: /data
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 80
    ports:
      - "127.0.0.1:3095:3095"
    security_opt:
      - no-new-privileges:true
    networks:
      - telefonie_web
      - caddy_shared
volumes:
  telefonie_data:

networks:
  telefonie_web:
    driver: bridge
  caddy_shared:
    external: true
    name: fahrschulpilot_web
