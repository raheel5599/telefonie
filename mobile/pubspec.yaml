name: tariq_telefonie
description: Native TARIQ Telefonie for Android and iOS.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  background_color_ios: '#0B0D11'
  remove_alpha_ios: true
