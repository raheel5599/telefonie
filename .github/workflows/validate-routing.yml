name: Telefonie Rufziele prüfen
on:
  push:
    branches: ['feature/web-routing-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax und Rufziel-Tests
        run: |
          node --check server.mjs
          node --check public/app.js
          python3 -m py_compile deployment/collect-pbx-status.py deployment/pbx_routing.py deployment/business_hours.py deployment/build-announcements.py
          python3 -m unittest discover -s tests -p "test_*.py"
          node tests/test-routing-ui.mjs
          node tests/test-hours-ui.mjs

      - name: Ansagenformat prüfen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng sox
          python3 deployment/build-announcements.py
