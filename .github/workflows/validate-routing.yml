name: Telefonie Rufziele prüfen
on:
  push:
    branches: ['feature/web-routing-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax und Rufziel-Tests
        run: |
          node --check server.mjs
          node --check public/app.js
          python3 -m py_compile deployment/collect-pbx-status.py deployment/pbx_routing.py
          python3 -m unittest discover -s tests -p "test_*.py"
          node tests/test-routing-ui.mjs
