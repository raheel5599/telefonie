name: Telefonie AMI Funktionstest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-ami.yml'
      - 'deployment/check-ami.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-ami:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: SSH bereitstellen
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          test -n "$SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "167.233.32.243 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEADJodfCjGq6bZaB1vjOJ7z4va3a+LmWE7p53NRF2KP" > ~/.ssh/known_hosts
      - name: AMI Diagnose auf Hetzner
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes fpadmin@167.233.32.243 '
            set -eu
            echo "=== PBX STATUS ==="
            docker inspect tariq-telefonie-asterisk --format "State={{.State.Status}} Restarts={{.RestartCount}}"
            echo "=== AMI SETTINGS ==="
            docker exec -u asterisk -w / tariq-telefonie-asterisk asterisk -rx "manager show settings" | grep -E "Manager \(AMI\)|TCP Bindaddress|Web Manager"
            echo "=== WEB STATUS ==="
            docker inspect tariq-telefonie-telefonie-web-1 --format "State={{.State.Status}}"
            echo "=== AMI FROM WEB CONTAINER ==="
            docker exec tariq-telefonie-telefonie-web-1 node /app/deployment/check-ami.mjs
          '

      - name: Netzwerkdiagnose Hetzner nach Friedberg (nur lesend)
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes fpadmin@167.233.32.243 '
            set -eu
            echo "=== ROUTE FRIEDBERG ==="
            ip -4 route get 192.168.2.1 || true
            ip -4 route get 192.168.20.1 || true
            echo "=== DEFAULT ROUTE ==="
            ip -4 route show default
            echo "=== WIREGUARD INTERFACE ==="
            ip -brief address show wg-friedberg || true
            echo "=== TELEKOM DNS ==="
            getent ahostsv4 tel.t-online.de | head -n 4 || true
            echo "=== SIP TARGET ROUTE ==="
            hostip=$(getent ahostsv4 tel.t-online.de | awk "NR==1 {print \$1}")
            if test -n "$hostip"; then ip -4 route get "$hostip" || true; fi
          '

      - name: WireGuard Peer Reachability (read only)
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes fpadmin@167.233.32.243 '
            echo "=== WG PEER (redacted keys) ==="
            sudo -n wg show wg-friedberg latest-handshakes 2>/dev/null | awk "{print \$2}" || true
            echo "=== WG TRANSFER (no keys) ==="
            sudo -n wg show wg-friedberg transfer 2>/dev/null | awk "{print \$2,\$3}" || true
            echo "=== WG PEER PING ==="
            ping -c 2 -W 2 192.168.2.1 || true
            echo "=== UNIFI LAN PING ==="
            ping -c 2 -W 2 192.168.20.1 || true
            echo "=== FORWARDING MODE ==="
            sysctl -n net.ipv4.ip_forward || true
            echo "=== DNS SRV TO TELEKOM ==="
            if command -v dig >/dev/null 2>&1; then dig +time=2 +tries=1 +short SRV _sip._udp.tel.t-online.de; else echo dig-not-available; fi
          '

      - name: Asterisk Netzpfad analysieren (nur lesend)
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes fpadmin@167.233.32.243 '
            echo "=== PBX NETWORKS ==="
            docker inspect tariq-telefonie-asterisk --format "{{range \$k,\$v := .NetworkSettings.Networks}}{{printf \"%s \" \$k}}{{end}}"
            echo "=== PBX NETWORK ISOLATION ==="
            docker network inspect tariq-telefonie-pbx_pbx_private --format "Internal={{.Internal}} Driver={{.Driver}}" || true
            echo "=== PBX ROUTES ==="
            docker exec -u asterisk -w / tariq-telefonie-asterisk sh -c "cat /proc/net/route" || true
            echo "=== HOST POLICY RULES ==="
            ip -4 rule show
            echo "=== HOST FORWARD RULES (read only) ==="
            ip -4 route get 192.168.2.1
          '

      - name: Telekom SIP Pfadpruefung ohne Routing-Aenderung
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes fpadmin@167.233.32.243 '
            echo "=== WIREGUARD PEER ALLOWED NETWORKS (without keys) ==="
            sudo -n wg show wg-friedberg allowed-ips 2>/dev/null | cut -f2- || true
            echo "=== TELEKOM SIP SRV ==="
            if command -v dig >/dev/null 2>&1; then
              dig +short SRV _sip._udp.tel.t-online.de
              for h in $(dig +short SRV _sip._udp.tel.t-online.de | awk "{print \$4}" | head -n 3); do
                echo "SIP hostname: $h"
                for ip in $(dig +short A "$h" | grep -E "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" | head -n 2); do
                  echo "Destination $ip route:"
                  ip -4 route get "$ip" || true
                done
              done
            else echo "dig unavailable"; fi
            echo "=== TELEKOM WAN MASQUERADE IS CONFIGURED ON UNIFI, NOT VERIFIED BY THIS TEST ==="
          '

      - name: SIP Isolations-Preflight (keine Aenderungen)
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes fpadmin@167.233.32.243 '
            echo "=== WG AllowedIPs via wg show (keys suppressed) ==="
            sudo -n wg show wg-friedberg allowed-ips 2>/dev/null | sed -E "s/^[^[:space:]]+[[:space:]]+//" || true
            echo "=== PBX bridge subnet ==="
            docker network inspect tariq-telefonie-pbx_pbx_private --format "Internal={{.Internal}} {{range .IPAM.Config}}Subnet={{.Subnet}} {{end}}" || true
            echo "=== SIP destination policy route ==="
            ip -4 route get 217.0.146.5 || true
            echo "=== Default route unaffected ==="
            ip -4 route show default
          '

      - name: WireGuard Konfiguration sicher pruefen (nur lesend)
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes fpadmin@167.233.32.243 '
            echo "=== WG PEER ALLOWED IPs (redacted public keys) ==="
            sudo -n wg show wg-friedberg allowed-ips 2>&1 | sed -E "s/^[A-Za-z0-9+\/=]{30,}[[:space:]]+//" || true
            echo "=== WG CLIENT CONFIG LOCATIONS (paths only) ==="
            sudo -n find /etc/wireguard -maxdepth 2 -type f -printf "%p\n" 2>/dev/null || true
            echo "=== WG DEVICE ADDRESS ==="
            ip -4 -brief addr show dev wg-friedberg || true
            echo "=== HOST FORWARDING ==="
            sysctl -n net.ipv4.ip_forward || true
            echo "=== ASTERISK SIP REGISTRATIONS ==="
            docker exec -u asterisk -w / tariq-telefonie-asterisk asterisk -rx "pjsip show registrations" | tail -n 8 || true
          '
