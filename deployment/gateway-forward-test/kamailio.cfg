#!KAMAILIO
debug=2
log_stderror=yes
children=1
listen=udp:0.0.0.0:5060
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "maxfwd.so"
request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (is_method("REGISTER") && $rd == "registrar") {
        $du = "sip:registrar:5070";
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }
    sl_send_reply("403", "Gateway Test Denied");
    exit;
}
