#!KAMAILIO
debug=2
log_stderror=yes
children=1
listen=udp:0.0.0.0:5060
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "maxfwd.so"
request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483","Too Many Hops");
        exit;
    }
    if (is_method("OPTIONS") && $rU == "gateway-health") {
        sl_send_reply("200","Gateway Lab OK");
        exit;
    }
    sl_send_reply("403","Lab Denies All Other SIP Requests");
    exit;
}
