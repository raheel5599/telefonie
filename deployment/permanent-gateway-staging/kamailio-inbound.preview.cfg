#!KAMAILIO
# INBOUND STAGING PREVIEW ONLY. NOT ACTIVE.
# This configuration is NOT a working public inbound trunk by itself.
# Requires verified inbound UDP path from Telekom via Friedberg and WireGuard,
# correct SIP Contact rewriting and firewall rules BEFORE activation.
debug=2
log_stderror=yes
children=1
listen=udp:172.25.254.10:5060
listen=udp:172.29.247.2:5060
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "maxfwd.so"
request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (is_method("OPTIONS") && $rU == "gateway-health") {
        sl_send_reply("200", "Gateway Staging Ready");
        exit;
    }
    if ($si == "172.25.0.2") {
        if (!is_method("REGISTER")) {
            sl_send_reply("405", "REGISTER Only");
            exit;
        }
        $du = "sip:217.0.146.5:5060;transport=udp";
        force_send_socket(udp:172.29.247.2:5060);
        if (!t_relay()) sl_reply_error();
        exit;
    }
    # Inbound relay disabled until public Contact / source IP / NAT / RTP verified.
    # NEVER use a blanket $si match on arbitrary public IPs or relay INVITEs.
    sl_send_reply("403", "Inbound Not Activated");
    exit;
}
