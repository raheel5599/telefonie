; STAGING ONLY — DO NOT INCLUDE IN RUNNING ASTERISK.
; REGISTER via the fixed Kamailio proxy. Asterisk will automatically REGISTER
; immediately if this file is included, so keep it offline until approved.
; The auth pair was confirmed in the one-shot Telekom Digest probe.
; WARNING: Contact and inbound SIP/RTP path have NOT been verified.
;
; Existing Asterisk transport-internal is defined in asterisk/pjsip.conf.
[telekom-friedberg-auth]
type=auth
auth_type=userpass
username=anonymous@t-online.de
password=anonymous@t-online.de

[telekom-friedberg-registration]
type=registration
transport=transport-internal
outbound_auth=telekom-friedberg-auth
server_uri=sip:tel.t-online.de
client_uri=sip:+4960316868187@tel.t-online.de
outbound_proxy=sip:172.25.254.10:5060\;lr
contact_user=+4960316868187
expiration=1620
retry_interval=60
forbidden_retry_interval=300
max_retries=2
; Do not activate before verifying Kamailio Contact/Via topology handling.
; Contact generated by Asterisk is likely 172.25.0.2:5060 (not routable by Telekom).
; A successful REGISTER alone does not establish inbound call delivery.
