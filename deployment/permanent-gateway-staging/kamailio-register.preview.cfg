#!KAMAILIO
# REGISTER-only staging proxy. Do not replace live kamailio.cfg until syntax and routing checks pass.
# Strictly limited to Asterisk 172.25.0.2 -> Telekom 217.0.146.5 UDP/5060.
debug=2
log_stderror=yes
children=1
listen=udp:172.25.254.10:5060
listen=udp:172.29.247.2:5060
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "maxfwd.so"
request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (is_method("OPTIONS") && $rU == "gateway-health") {
        sl_send_reply("200", "Gateway Staging Ready");
        exit;
    }
    if ($si != "172.25.0.2" || $sp < 1) {
        sl_send_reply("403", "Unauthorized Source");
        exit;
    }
    if (!is_method("REGISTER")) {
        sl_send_reply("405", "REGISTER Only");
        exit;
    }
    # The outbound interface and destination are fixed; never proxy arbitrary SIP targets.
    $du = "sip:217.0.146.5:5060;transport=udp";
    force_send_socket(udp:172.29.247.2:5060);
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
