name: tariq-telefonie-pbx

# Isolierte PBX, keine SIP-/RTP-Freigaben und keine Telekom-Zugangsdaten.
services:
  asterisk:
    image: andrius/asterisk:22.10.1_debian-trixie
    container_name: tariq-telefonie-asterisk
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    networks:
      - pbx_private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    # Healthcheck uses Asterisk service account for socket and spool access.
    healthcheck:
      test: ["CMD-SHELL", "runuser -u asterisk -- /usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - asterisk_state:/var/lib/asterisk
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./private/manager.conf:/etc/asterisk/manager.conf:ro

volumes:
  asterisk_state:
    external: true
    name: tariq-telefonie-pbx_asterisk_state

networks:
  pbx_private:
    internal: true
