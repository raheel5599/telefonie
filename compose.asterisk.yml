# Isolierte PBX, keine SIP-/RTP-Freigaben und keine Telekom-Zugangsdaten.
services:
  asterisk:
    image: andrius/asterisk:22.10.1_debian-trixie
    container_name: tariq-telefonie-asterisk
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    networks:
      - pbx_private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - asterisk_state:/var/lib/asterisk

volumes:
  asterisk_state:

networks:
  pbx_private:
    internal: true
