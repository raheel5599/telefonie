; STAGING ONLY - do not include in live pjsip.conf yet.
; Telekom registration tested with anonymous@t-online.de over Friedberg WireGuard.
; Requires isolated outbound routing, verified inbound SIP/RTP, and NAT handling.
; Do not load before connectivity checks.
[telekom-friedberg-auth]
type=auth
auth_type=userpass
username=anonymous@t-online.de
password=anonymous@t-online.de

[telekom-friedberg-registration]
type=registration
transport=transport-internal
outbound_auth=telekom-friedberg-auth
server_uri=sip:tel.t-online.de
client_uri=sip:+4960316868187@tel.t-online.de
contact_user=+4960316868187
retry_interval=60
forbidden_retry_interval=300
expiration=1620
max_retries=2
; outbound_proxy / contact rewrite to be confirmed before activation.

[telekom-friedberg-endpoint]
type=endpoint
transport=transport-internal
context=telekom-inbound-staging
disallow=all
allow=alaw,ulaw
aors=telekom-friedberg-aor
outbound_auth=telekom-friedberg-auth
from_domain=tel.t-online.de
from_user=+4960316868187
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[telekom-friedberg-aor]
type=aor
contact=sip:tel.t-online.de

[telekom-friedberg-identify]
type=identify
endpoint=telekom-friedberg-endpoint
match=217.0.146.5
; Staging: only tested SIP server; additional legitimate signaling IPs may exist.
